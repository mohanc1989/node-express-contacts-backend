name: Node CI

on:
  push:
   branches: [ main, develop ] 

  jobs:
    test:
    run-on: ubuntu-latest

    steps:
     -name: Checkout code
      uses: actions/checkout@v3

     -name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

     -name: Install dependencies
      run: npm ci

     run: npm run build --if-present
     run: npm test